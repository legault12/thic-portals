name: tests

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Syntax check and test suites
        run: ./tests/run.sh
        env:
          LUA: lua5.4
